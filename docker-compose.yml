services:
  postgres:
    image: postgres:16-alpine
    container_name: sce-postgres
    environment:
      POSTGRES_USER: sce
      POSTGRES_PASSWORD: sce_dev_password
      POSTGRES_DB: sce_dev
    ports:
      - '5432:5432'
    volumes:
      - sce_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sce -d sce_dev']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sce_pgdata:
